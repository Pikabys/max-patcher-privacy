name: Build Patched APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK manually
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          cd /tmp

          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip

          unzip cmdline-tools.zip -d cmdline-tools-temp

          sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest

          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest

          sudo mv cmdline-tools-temp/cmdline-tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses + install packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0"

      - name: Add Build Tools to PATH
        run: |
          echo "/usr/local/lib/android/sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Apktool
        run: |
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

          sudo mv apktool.jar /usr/local/bin/apktool.jar

          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo 'java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool

          sudo chmod +x /usr/local/bin/apktool

      - name: Download APK
        run: |
          mkdir -p source_apk
          wget -O source_apk/ru.oneme.app.apk "https://dw.uptodown.net/dwn/xFWEqH0Rt_3TW6-f4GnMQ0HEuYuRnuNVOPu4cko0wo14POqSJl-UkOV2_WhIqd_4PxtnxCteGaSRr9LRl5cis2XZ4lqjfynSrwfcc9AZM_0Czvpg-9A9JY8FJPdwMEBh/1A2Z9iFC9sn7Yp89o-nAPacpEMLjB1MsLKuLK4LAd9C5MTFSLpq_hUQEKqnkX98nrK9_X3-SxZyTFj4eBe_mmoA7sS9F5KzeV8_gkBvbUwV3uZ6mcUZwJvaJHpm9cL2b/15rfOn34tvKI81iFOX81DS9p1SzqC3rCdjkpsufDQTQaVd7b4CUs47GmWu8ONpIz723egmWM5ueE0broj3l8Yw==/max-26-15-0.apk"

      - name: Decompile APK
        run: |
          apktool d source_apk/ru.oneme.app.apk -f -o apk_workdir

      - name: Run Python Patcher
        run: |
          python scripts/patcher.py

      - name: Remove original signature
        run: |
          rm -rf apk_workdir/original/META-INF
          rm -rf apk_workdir/original/stamp-cert-sha256

      - name: Rebuild APK
        run: |
          apktool b apk_workdir -c -o rebuilt_unsigned.apk

      - name: Zipalign APK
        run: |
          zipalign -v 4 rebuilt_unsigned.apk rebuilt_aligned.apk

      - name: Generate signing key
        run: |
          keytool -genkey -v \
            -keystore temp-release-key.keystore \
            -alias temp_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temppassword \
            -keypass temppassword \
            -dname "CN=Anonymous, OU=Anonymous, O=Anonymous, L=Unknown, ST=Unknown, C=XX"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks temp-release-key.keystore \
            --ks-key-alias temp_alias \
            --ks-pass pass:temppassword \
            --key-pass pass:temppassword \
            rebuilt_aligned.apk

      - name: Final APK
        run: |
          mv rebuilt_aligned.apk patched-app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: patched-app-release.apk
